; Defence in depth only. PHP itself must have the October 2026 security patch.
; .user.ini cannot mitigate vulnerabilities that trigger before request startup.
expose_php=Off
display_errors=Off
display_startup_errors=Off
log_errors=On
file_uploads=Off
post_max_size=2M
upload_max_filesize=1M
max_input_vars=100
session.cookie_httponly=1
session.cookie_secure=1
session.cookie_samesite=Strict
session.use_strict_mode=1
